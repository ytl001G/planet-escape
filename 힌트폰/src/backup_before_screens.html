<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>힌트폰 논리도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  /* 레이아웃: 한 줄 세로 문서. 1부는 릴리 보라, 2부는 비아 주황으로 구간을 가른다 */
  --paper: #f7f6f9;
  --card: #ffffff;
  --ink: #1f1d24;
  --muted: #6b6775;
  --line: #d9d5e0;
  --lily: #8e24aa;
  --lily-soft: #efe3f4;
  --via: #c46a00;
  --via-soft: #fdebd6;
  --sys-soft: #ebe9ee;
  --display: "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
  --body: "Noto Sans KR", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17151b; --card: #211e26; --ink: #ece9f1; --muted: #a39eab; --line: #3a3541;
    --lily: #cf86e6; --lily-soft: #35243d; --via: #ffae4d; --via-soft: #3b2a17; --sys-soft: #2b2830;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17151b; --card: #211e26; --ink: #ece9f1; --muted: #a39eab; --line: #3a3541;
  --lily: #cf86e6; --lily-soft: #35243d; --via: #ffae4d; --via-soft: #3b2a17; --sys-soft: #2b2830;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.65 var(--body); }
main { max-width: 1560px; margin: 0 auto; padding: 40px 20px 72px; display: grid; gap: 44px; }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; }
h1 { font-size: 30px; line-height: 1.25; }
h2 { font-size: 20px; margin-bottom: 12px; }
p { margin: 0; max-width: 68ch; }
.lead { color: var(--muted); margin-top: 8px; }
.src { font-size: 13px; color: var(--muted); margin-top: 10px; }
figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; overflow-x: auto; }
figure svg { display: block; width: 100%; height: auto; color: var(--ink); }
figcaption { font-size: 13px; color: var(--muted); margin-top: 12px; max-width: 80ch; }
svg text { font-family: var(--body); fill: currentColor; }
svg .n { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
svg .lily { fill: var(--lily-soft); stroke: var(--lily); stroke-width: 1.5; }
svg .via { fill: var(--via-soft); stroke: var(--via); stroke-width: 1.5; }
svg .lily-band { fill: var(--lily-soft); stroke: none; opacity: .55; }
svg .via-band { fill: var(--via-soft); stroke: none; opacity: .6; }
svg .dashbox { fill: none; stroke-dasharray: 6 5; }
svg .vfill { fill: var(--via); }
svg .ck { fill: none; stroke: var(--card); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg .bar { fill: var(--lily); }
svg .soft { fill: var(--sys-soft); stroke: none; }
svg .ln { fill: none; stroke: currentColor; stroke-width: 1.4; }
svg .dash { stroke-dasharray: 5 4; opacity: .75; }
svg .t-lily { fill: var(--lily); }
svg .t-via { fill: var(--via); }
svg .t-mute { fill: var(--muted); }
.rules { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.rules li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.rules b { font-weight: 700; }

/* 진행 가이드 흐름 */
.band { border-radius: 12px; padding: 16px; display: grid; gap: 12px; border: 1px solid var(--line); background: var(--card); }
.band > header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.band > header b { font-family: var(--display); font-size: 16px; }
.band > header span { font-size: 13px; color: var(--muted); }
.band.p1 { border-left: 6px solid var(--lily); }
.band.p2 { border-left: 6px solid var(--via); }
.band.mid { border-left: 6px solid var(--muted); }
.steps { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.steps li { position: relative; flex: 1 1 170px; max-width: 240px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.steps li strong { display: block; font-weight: 700; }
.steps li small { display: block; color: var(--muted); font-size: 12px; }
.steps li q { display: block; margin-top: 6px; font-size: 13px; color: var(--via); quotes: "“" "”"; }
.steps li .code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.chip { display: inline-block; margin-top: 6px; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--sys-soft); color: var(--muted); }
.p1 .chip.card { background: var(--lily-soft); color: var(--lily); }
.p2 .chip.card, .mid .chip.card { background: var(--via-soft); color: var(--via); }
.arrow-down { text-align: center; color: var(--muted); font-size: 13px; }

table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--card); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 700; background: var(--sys-soft); }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.warn { color: var(--via); font-weight: 700; }

.open { display: grid; gap: 10px; counter-reset: q; padding: 0; margin: 0; list-style: none; }
.open li { counter-increment: q; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px 12px 48px; position: relative; }
.open li::before { content: counter(q); position: absolute; left: 16px; top: 12px; font: 700 14px var(--mono); color: var(--lily); }
.open li p + p { margin-top: 4px; color: var(--muted); font-size: 14px; }
 .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 32px; align-items: start; }
.col { display: grid; gap: 40px; min-width: 0; }
.coltitle { font: 700 13px var(--display); letter-spacing: .08em; color: var(--muted); border-bottom: 2px solid var(--line); padding-bottom: 6px; max-width: none; }
@media (max-width: 1000px) { .split { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 480px) { h1 { font-size: 24px; } .steps li { max-width: none; } }
</style>
</head>

<section>
